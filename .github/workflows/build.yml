name: Build T1000-E Tracker Firmware

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GPS-30s
            interval: 30
            patch: standard
          - name: GPS-10s
            interval: 10
            patch: standard
          - name: AutoTracker-BETA
            interval: 30
            patch: beta
    steps:
      - name: Checkout tracker repo
        uses: actions/checkout@v4

      - name: Checkout MeshCore Companion v1.17.1
        run: |
          git clone --depth 1 --branch companion-v1.17.1 https://github.com/meshcore-dev/MeshCore.git meshcore

      - name: Apply standard tracker defaults
        if: matrix.patch == 'standard'
        working-directory: meshcore
        run: |
          chmod +x ../patch_t1000e_gps_default.sh
          ../patch_t1000e_gps_default.sh ${{ matrix.interval }}
          grep -n "gps_enabled\|gps_interval\|buzzer_quiet" examples/companion_radio/NodePrefs.h

      - name: Apply Auto Tracker BETA patch
        if: matrix.patch == 'beta'
        working-directory: meshcore
        run: |
          chmod +x ../patch_t1000e_gps_default.sh ../patch_t1000e_autotracker_beta.sh
          ../patch_t1000e_gps_default.sh 30
          ../patch_t1000e_autotracker_beta.sh
          grep -n "gps_enabled\|gps_interval\|buzzer_quiet" examples/companion_radio/NodePrefs.h
          grep -n "autoTrackerLoop\|SIGNIFICANT_MOVE_METERS\|CHECK_INTERVAL_MS" examples/companion_radio/MyMesh.h examples/companion_radio/MyMesh.cpp

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build T1000-E BLE Companion
        working-directory: meshcore
        run: pio run -e t1000e_companion_radio_ble

      - name: Create UF2
        working-directory: meshcore
        run: pio run -e t1000e_companion_radio_ble -t create_uf2

      - name: Verify and collect UF2
        working-directory: meshcore
        run: |
          test -f .pio/build/t1000e_companion_radio_ble/firmware.uf2
          cp .pio/build/t1000e_companion_radio_ble/firmware.uf2 ../HTR-T1000E-MeshCore-v1.17.1-${{ matrix.name }}.uf2
          ls -lh ../HTR-T1000E-MeshCore-v1.17.1-${{ matrix.name }}.uf2

      - name: Upload UF2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: HTR-T1000E-MeshCore-v1.17.1-${{ matrix.name }}
          path: HTR-T1000E-MeshCore-v1.17.1-${{ matrix.name }}.uf2
